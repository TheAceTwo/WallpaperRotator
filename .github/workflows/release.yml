# Push a tag like v0.1.0 to build installers into a *draft* GitHub release.
# Review the draft, then click Publish.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Check updater signing setup
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if grep -q REPLACE_WITH_UPDATER_PUBLIC_KEY desktop/src-tauri/tauri.conf.json; then
            echo "::error::Put the updater public key in desktop/src-tauri/tauri.conf.json (see README > Auto-updates)."; exit 1
          fi
          if [ -z "$KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY repository secret (see README > Auto-updates)."; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri CLI
        working-directory: desktop
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs update bundles so installed apps can verify them (see README > Auto-updates).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional, for signed + notarized macOS builds (Apple Developer Program).
          # Add these as repository secrets; leave unset for unsigned builds.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Wallpaper Rotator ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}"
          # Write release notes above the download guide when editing the draft.
          releaseBody: |
            ## Which file do I download?

            | Your device | Download this | Notes |
            |---|---|---|
            | **Windows 10/11** | the file ending in `_x64-setup.exe` | If Windows says "Windows protected your PC", click **More info → Run anyway**. |
            | **Mac** (Intel or Apple Silicon) | the file ending in `_universal.dmg` | Open it and drag the app to Applications. The first time, go to **System Settings → Privacy & Security → Open Anyway**. |
            | **Chromebook** | `wallpaper-rotator-chromeos.zip` | Unzip it, open `chrome://extensions`, turn on **Developer mode**, click **Load unpacked**, and pick the folder. |
            | **iPhone** | No download | Follow the [iPhone setup guide](https://github.com/${{ github.repository }}/blob/main/ios-shortcut/README.md). |

            You can ignore the other files (`.msi`, `.app.tar.gz`, `.sig`, `latest.json`). The app uses them for automatic updates.

            Already installed? The Windows and Mac apps update themselves.
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  chromeos-extension:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip extension
        run: |
          cd chromeos-extension
          zip -r ../wallpaper-rotator-chromeos.zip . -x 'test/*'
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          if [ -z "$TAG" ]; then TAG="v$(jq -r .version desktop/src-tauri/tauri.conf.json)"; fi
          gh release upload "$TAG" wallpaper-rotator-chromeos.zip --clobber
