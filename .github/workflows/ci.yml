name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Rust tests (core + wallsetter)
        run: cargo test -p immich-core -p wallsetter
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ChromeOS extension tests
        run: node --test chromeos-extension/test/immich.test.mjs

  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: "" }
          - { os: windows-latest, target: aarch64-pc-windows-msvc } # Windows on ARM
          - { os: macos-latest, target: "" }
          - { os: ubuntu-22.04, target: "" }
    name: build-desktop (${{ matrix.os }}${{ matrix.target && format(', {0}', matrix.target) || '' }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build desktop app
        shell: bash
        run: cargo build -p wallpaper-rotator ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
