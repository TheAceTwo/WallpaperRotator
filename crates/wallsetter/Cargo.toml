[package]
name = "wallsetter"
description = "Set desktop and lock screen wallpaper on Windows and macOS"
version.workspace = true
edition.workspace = true
license.workspace = true

[target.'cfg(windows)'.dependencies]
auto-launch = "0.6"
winreg = "0.55"
windows = { version = "0.61", features = [
  "Foundation",
  "Storage",
  "Storage_Streams",
  "System_UserProfile",
  "UI",
  "UI_ViewManagement",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
auto-launch = "0.6"
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSDictionary", "NSArray", "NSThread", "NSError", "NSValue"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSScreen", "NSColor", "NSColorSpace"] }
